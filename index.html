function prefersReducedMotion() {
  if (typeof window === "undefined" || !window.matchMedia) return false;
  return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function Reveal({ children, as: Tag = "div", className = "", delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    if (prefersReducedMotion()) {
      setVisible(true);
      return;
    }
    const node = ref.current;
    if (!node) return;
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            setVisible(true);
            observer.disconnect();
          }
        });
      },
      { threshold: 0.15, rootMargin: "0px 0px -40px 0px" }
    );
    observer.observe(node);
    return () => observer.disconnect();
  }, []);

  return (
    <Tag
      ref={ref}
      className={`reveal ${visible ? "is-visible" : ""} ${className}`}
      style={{ transitionDelay: visible ? `${delay}ms` : "0ms" }}
    >
      {children}
    </Tag>
  );
}

function OrderModal({ itemName, onClose }) {
  const closeBtnRef = useRef(null);

  useEffect(() => {
    closeBtnRef.current?.focus();
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
    };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => {
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
  }, [onClose]);

  return (
    <div className="modal-backdrop" onMouseDown={onClose}>
      <div
        className="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="order-modal-heading"
        onMouseDown={(e) => e.stopPropagation()}
      >
        <button
          type="button"
          className="modal-close"
          onClick={onClose}
          aria-label="Close dialog"
          ref={closeBtnRef}
        >
          ×
        </button>
        <p className="eyebrow">Order Ahead</p>
        <h3 id="order-modal-heading">
          {itemName ? `You'd like the ${itemName}?` : "Ready to order?"}
        </h3>
        <p>
          We keep ordering simple — no app required. Call the shop and we'll have your order
          ready when you arrive, or walk in any time we're open.
        </p>
        <div className="modal-actions">
          <a className="btn btn-primary" href={`tel:${PHONE_TEL}`}>
            Call {PHONE_DISPLAY}
          </a>
          <a className="btn btn-secondary" href={MAPS_URL} target="_blank" rel="noopener noreferrer">
            Get Directions
          </a>
        </div>
        <p className="modal-footnote">
          {ADDRESS_LINE1}, {ADDRESS_LINE2}
        </p>
      </div>
    </div>
  );
}

  useEffect(() => {
    document.title = "Morrow Coffee — Specialty Coffee Shop in London";

    if (!meta) {
      meta = document.createElement("meta");
      meta.setAttribute("name", "description");
      document.head.appendChild(meta);
    }
    meta.setAttribute(
      "content",
      "Morrow Coffee is a specialty coffee shop on Willow Street, London, serving carefully sourced espresso, filter coffee, matcha and simple seasonal food. Good coffee. Slow mornings."
    );
  }, []);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const navigate = useCallback((id) => {
    const el = document.getElementById(id);
    setMobileOpen(false);
    if (el) {
      el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
    }
  }, []);

  const openOrder = useCallback((name) => {
    setOrderItem(name ?? null);
    setOrderOpen(true);
  }, []);

  const closeOrder = useCallback(() => {
    setOrderOpen(false);
    setOrderItem(null);
  }, []);

  return (
    <div className="morrow-app">
      <GlobalStyles />

      <a href="#main" className="skip-link">
        Skip to content
      </a>

      <Header
        scrolled={scrolled}
        mobileOpen={mobileOpen}
        onToggleMobile={() => setMobileOpen((v) => !v)}
        onNavigate={navigate}
        onOrderClick={() => openOrder(null)}
      />

      <main id="main">
        <Hero onNavigate={navigate} />
        <FeaturedMenu onOrder={openOrder} />
        <About />
        <SignatureDrink onOrder={openOrder} />
        <Gallery />
        <Testimonials />
        <Visit />
      </main>

      <Footer onNavigate={navigate} />

      {orderOpen && <OrderModal itemName={orderItem} onClose={closeOrder} />}
    </div>
  );
}
